spec:
  replicas: 1
  selector:
    matchLabels:
      app: opspulse-broken-image
  template:
    metadata:
      labels:
        app: opspulse-broken-image
    spec:
      containers:
        - name: app
          image: devopscapstoneproject-backend:v999-broken-tag-does-not-exist
          imagePullPolicy: Always
