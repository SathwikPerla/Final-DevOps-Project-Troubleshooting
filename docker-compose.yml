services:
  postgres:
    image: postgres:16-alpine
    container_name: sevzero-postgres
    environment:
      POSTGRES_DB: sevzero
      POSTGRES_USER: sevzero
      POSTGRES_PASSWORD: sevzero
    ports:
      - "5432:5432"
    volumes:
      - sevzero-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevzero -d sevzero"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: sevzero-backend
    environment:
      DATABASE_URL: postgresql+psycopg://sevzero:sevzero@postgres:5432/sevzero
      APP_NAME: "SevZero SRE Incident API"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sevzero-frontend
    depends_on:
      - backend
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes:
  sevzero-data:
