name: OpsPulse CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Automated Testing & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - name: Run Pytest test suite
        run: pytest -v
        working-directory: backend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies & build
        run: |
          npm install
          npm run build
        working-directory: frontend

  build-scan-push:
    name: Build, Trivy Security Scan & GHCR Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend Docker image
        run: |
          docker build -t ghcr.io/${{ env.OWNER_LC }}/opspulse-backend:${{ github.sha }} ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t ghcr.io/${{ env.OWNER_LC }}/opspulse-frontend:${{ github.sha }} ./frontend

      - name: Trivy vulnerability scan (Backend Image)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            ghcr.io/${{ env.OWNER_LC }}/opspulse-backend:${{ github.sha }}

      - name: Trivy vulnerability scan (Frontend Image)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            ghcr.io/${{ env.OWNER_LC }}/opspulse-frontend:${{ github.sha }}

      - name: Push images to GitHub Container Registry
        run: |
          docker push ghcr.io/${{ env.OWNER_LC }}/opspulse-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER_LC }}/opspulse-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes Cluster via Helm
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Helm 3
        uses: azure/setup-helm@v4

      - name: Deploy OpsPulse Helm Release (Cluster or Dry-Run Validation)
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -n "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA detected. Deploying to live Kubernetes cluster..."
            mkdir -p ~/.kube
            echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
            helm upgrade --install opspulse ./helm/opspulse \
              --namespace opspulse \
              --create-namespace \
              --set backend.tag=${{ github.sha }} \
              --set frontend.tag=${{ github.sha }} \
              --set backend.image=ghcr.io/${{ env.OWNER_LC }}/opspulse-backend \
              --set frontend.image=ghcr.io/${{ env.OWNER_LC }}/opspulse-frontend
          else
            echo "No live cluster secret detected. Validating Helm chart syntax and synthesis..."
            helm lint ./helm/opspulse
            helm template opspulse ./helm/opspulse \
              --set backend.tag=${{ github.sha }} \
              --set frontend.tag=${{ github.sha }} \
              --set backend.image=ghcr.io/${{ env.OWNER_LC }}/opspulse-backend \
              --set frontend.image=ghcr.io/${{ env.OWNER_LC }}/opspulse-frontend
            echo "Helm templates validated successfully!"
          fi
