global:
  environment: production

namespace: sevzero

backend:
  replicaCount: 2
  image:
    repository: devopscapstoneproject-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    DATABASE_URL: "postgresql+psycopg://sevzero:sevzero@sevzero-postgres:5432/sevzero"
    APP_NAME: "SevZero Incident Management API"

frontend:
  replicaCount: 2
  image:
    repository: devopscapstoneproject-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 1Gi
  database: sevzero
  username: sevzero
  password: sevzero

ingress:
  enabled: true
  className: nginx
  host: sevzero.local

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

serviceMonitor:
  enabled: false
  interval: 15s
  path: /metrics
