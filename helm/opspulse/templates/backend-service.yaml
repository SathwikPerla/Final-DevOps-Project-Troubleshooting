apiVersion: v1
kind: Service
metadata:
  name: opspulse-backend
  labels:
    app: opspulse-backend
    app.kubernetes.io/name: opspulse-backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: opspulse-backend
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: opspulse-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: opspulse-backend
